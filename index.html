<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnswerHub</title>
    <style>
        body {
            background-image: url('https://static.vecteezy.com/system/resources/previews/013/403/839/non_2x/seamless-pattern-from-of-question-marks-vector.jpg');
            background-size: 300px;
            background-repeat: repeat;
            background-color: #1a0a0a;        /* было #fce4ec – теперь тёмный */
            background-blend-mode: darken;    /* затемняет фоновое изображение */
            color: #ffffff;
            font-family: "Courier New", monospace;
            margin: 0;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .wordart-header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin: 10px auto;
            max-width: 180px;
        }

        .wordart-logo {
            width: 100%;
            height: auto;
        }

        .main-content-table {
            max-width: 750px;
            margin: 20px auto;
            background-color: #1a0a0a;
            border: 3px double #ff3333;
            padding: 25px;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .auth-bar {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.8em;
        }

        .auth-btn {
            background: #251010;
            color: #00ffff;
            border: 1px solid #ff3333;
            padding: 3px 8px;
            cursor: pointer;
            font-family: "Courier New", monospace;
            margin-left: 5px;
        }

        .auth-btn:hover {
            background: #ff3333;
            color: #000;
        }

        .welcome-block {
            text-align: center;
            border-bottom: 1px solid #ff3333;
            padding-bottom: 20px;
            margin-bottom: 20px;
            margin-top: 20px;
        }

        .welcome-title {
            color: #ffcc00;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .music-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
            min-height: 60px;
        }

        .music-gif-box {
            width: 50px;
            height: 50px;
            display: none;
        }

        .music-gif-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .music-btn {
            background: #ffcc00;
            color: #000;
            border: 2px outset #fff;
            padding: 8px 20px;
            cursor: pointer;
            font-weight: bold;
            font-family: "Courier New", monospace;
        }

        .music-btn:active {
            border-style: inset;
        }

        .notepad-box {
            background: #110505;
            border: 1px solid #ffcc00;
            padding: 15px;
            margin: 25px 0;
        }

        .notepad-title {
            color: #ffcc00;
            font-size: 0.85em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .notepad-area {
            width: 95%;
            height: 60px;
            background: #1a0a0a;
            border: 1px solid #ff3333;
            color: #ffcc00;
            font-family: "Courier New", monospace;
            padding: 8px;
            resize: none;
        }

        .notepad-btn {
            background: #ff3333;
            color: #fff;
            border: 1px solid #fff;
            padding: 3px 10px;
            font-size: 0.8em;
            cursor: pointer;
            margin-top: 5px;
            font-family: "Courier New", monospace;
        }

        .content-list {
            background: #251010;
            padding: 15px 20px 15px 40px;
            border: 1px dashed #ff3333;
            margin-bottom: 30px;
        }

        .content-list li {
            margin-bottom: 5px;
        }

        h2 {
            color: #ffcc00;
            font-size: 1.1em;
            margin-top: 40px;
            border-bottom: 1px dashed #331111;
            padding-bottom: 5px;
        }

        p {
            font-size: 0.95em;
            line-height: 1.5;
        }

        a {
            color: #00ffff;
            text-decoration: underline;
        }

        a:hover {
            color: #ffcc00;
        }

        .early-censored {
            background: #ff3333;
            color: #ff3333;
            cursor: help;
            padding: 10px;
            margin-top: 10px;
            display: block;
            user-select: none;
            word-spacing: 5px;
            line-height: 1.4;
        }

        .early-censored:hover {
            background: #ffcc00;
            color: #000000;
        }

        .guestbook-title {
            color: #ffcc00;
            margin-top: 50px;
            text-align: center;
            font-size: 1.1em;
            text-transform: uppercase;
            border-top: 1px solid #ff3333;
            padding-top: 20px;
        }

        .comment-card {
            border-top: 1px dashed #331111;
            padding: 15px 0;
            display: flex;
            gap: 15px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border: 1px solid #ff3333;
            background: #331111;
            flex-shrink: 0;
        }

        .comment-body {
            display: flex;
            flex-direction: column;
        }

        .comment-author {
            font-weight: bold;
            color: #00ff66;
            font-size: 0.9em;
        }

        .comment-text {
            font-size: 0.9em;
            color: #dddddd;
            margin-top: 5px;
        }

        .comment-date {
            font-size: 0.75em;
            color: #666666;
            margin-top: 5px;
        }

        .counter-box {
            text-align: center;
            margin-top: 40px;
            font-size: 0.8em;
            color: #888;
        }

        .counter-digits {
            background: #000;
            color: #00ff00;
            padding: 2px 6px;
            border: 1px solid #333;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <!-- всё остальное содержимое остаётся без изменений -->

        <img src="ahubWELCOME.png" alt="WELCOME" class="wordart-logo">
        <img src="ahubtothe.png" alt="TO THE" class="wordart-logo">
        <img src="ahubAnswerHub.png" alt="ANSWER HUB" class="wordart-logo">
    </div>

    <div class="main-content-table">
        <!-- ... остальной код ... -->
    </div>
    <!-- скрипты и т.д. -->
</body>
</html>
